<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#000000" />

    <!-- ═══════════════════════════════════════════════════════════════════════
         CRITICAL INTRO VIDEO PRELOAD — Instant 0ms playback on page open
         PERF IMPACT: Browser begins high-priority streaming of intro video
                      in parallel with HTML parsing before JS execution.
    ═══════════════════════════════════════════════════════════════════════ -->
    <link rel="preload" href="/videos/intro-desktop.mp4" as="video" type="video/mp4" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" href="/videos/intro-mobile.mp4" as="video" type="video/mp4" media="(max-width: 767px)" fetchpriority="high" />

    <!-- ═══════════════════════════════════════════════════════════════════════
         PAGE TITLE & META — SEO optimized for Hyderabad interior design queries
    ═══════════════════════════════════════════════════════════════════════ -->
    <title>ESPACIO — Premium Interior Design &amp; Architecture | Hyderabad</title>
    <meta name="description" content="ESPACIO is Hyderabad's premier luxury interior design studio specializing in turn-key residential interiors, modular kitchens, commercial fit-outs, and premium materials supply." />

    <!-- ═══════════════════════════════════════════════════════════════════════
         RESOURCE HINTS — Tell the browser where to connect before it finds links
         PERF IMPACT: Eliminates DNS lookup + TLS handshake latency (~150–300ms saved)
    ═══════════════════════════════════════════════════════════════════════ -->
    <!-- preconnect: Warm up TCP+TLS connection to Google Fonts CDN immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- preconnect + crossorigin: Required for CORS font file downloads from gstatic -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ═══════════════════════════════════════════════════════════════════════
         GOOGLE FONTS — Non-blocking, async font loading pattern
         PERF IMPACT: Fonts load without blocking HTML parsing or rendering
         TECHNIQUE: media="print" trick defers CSS application until after parse
         FALLBACK: <noscript> for JS-disabled environments
    ═══════════════════════════════════════════════════════════════════════ -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,500;1,600;1,700&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap" />
    </noscript>

    <!-- ═══════════════════════════════════════════════════════════════════════
         LCP HERO IMAGE PRELOAD — Critical for PageSpeed / Core Web Vitals
         PERF IMPACT: Background preload so hero section is ready when intro finishes
    ═══════════════════════════════════════════════════════════════════════ -->
    <link rel="preload" as="image" href="/images/hero/hero_bedroom_916.webp" type="image/webp" media="(max-width: 768px)" />
    <link rel="preload" as="image" href="/images/hero/hero_bedroom_4k.webp" type="image/webp" media="(min-width: 769px)" />

    <!-- ═══════════════════════════════════════════════════════════════════════
         OPEN GRAPH META — Social media card rendering (Facebook, LinkedIn, WhatsApp)
    ═══════════════════════════════════════════════════════════════════════ -->
    <meta property="og:site_name" content="ESPACIO Interiors" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ESPACIO — Premium Interior Design &amp; Architecture" />
    <meta property="og:description" content="Hyderabad's premier luxury interior design studio delivering turn-key full-home interiors, modular kitchens, and material supply." />
    <meta property="og:image" content="/images/company/3bhk_lux/open_hall.png" />

    <!-- ═══════════════════════════════════════════════════════════════════════
         TWITTER CARD META — Twitter/X link preview rendering
    ═══════════════════════════════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ESPACIO — Premium Interior Design &amp; Architecture" />
    <meta name="twitter:description" content="Hyderabad's premier luxury interior design studio delivering turn-key full-home interiors, modular kitchens, and material supply." />
    <meta name="twitter:image" content="/images/company/3bhk_lux/open_hall.png" />
  </head>

  <body class="bg-black text-ink font-sans antialiased overflow-x-hidden" style="background-color: #000000; margin: 0; padding: 0;">
    <!-- React SPA mount point — instant dark shell prevents any 0ms white or cream paint lag -->
    <div id="root">
      <div id="espacio-instant-preloader-shell" style="position:fixed;inset:0;z-index:999999;width:100vw;height:100vh;background-color:#000000;"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════════
         ENTRY SCRIPT — type="module" enables native ES module loading
         PERF: Vite injects <link rel="modulepreload"> for all critical chunks
               This parallelizes download of vendor-react, vendor-motion, etc.
    ═══════════════════════════════════════════════════════════════════════ -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
