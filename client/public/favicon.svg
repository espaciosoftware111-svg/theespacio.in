<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -20 480 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap');
      .brand-title {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 0.16em;
        fill: #171512;
        text-anchor: middle;
      }
      .brand-subtitle {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.44em;
        fill: #171512;
        text-anchor: middle;
      }
    </style>
    <radialGradient id="bulbGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFC46B" stop-opacity="1"/>
      <stop offset="45%" stop-color="#FFC46B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFC46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spotlightCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC46B" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#FFC46B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFC46B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Clean Warm Cream Background matching Instagram Profile DP -->
  <rect x="-60" y="-60" width="600" height="600" fill="#F4EFEA"/>

  <!-- Spotlight Cone -->
  <path d="M 133 136 L 90 230 H 212 L 169 136 Z" fill="url(#spotlightCone)"/>

  <!-- Glow Ellipse -->
  <ellipse cx="151" cy="150" rx="38" ry="24" fill="url(#bulbGlow)"/>

  <!-- T-bar Top horizontal line -->
  <path d="M120 70 H182" stroke="#171512" stroke-width="7" stroke-linecap="square"/>

  <!-- T-bar vertical stem line -->
  <path d="M151 70 V108" stroke="#171512" stroke-width="7" stroke-linecap="square"/>

  <!-- Lamp Shade Cone -->
  <path d="M151 108 L133 136 H169 Z" fill="#171512"/>

  <!-- Bulb filament -->
  <line x1="140" y1="138" x2="162" y2="138" stroke="#FFC46B" stroke-width="3" stroke-linecap="round"/>

  <!-- Outer Framing Brackets -->
  <path d="M204 70 H300 V250" fill="none" stroke="#171512" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M120 160 V250 H300" fill="none" stroke="#171512" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Architectural 'E' Glyph -->
  <path d="M236 152 H280 M236 152 V226 M236 189 H270 M236 226 H280" fill="none" stroke="#171512" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Brand Wordmark ESPACIO -->
  <text x="210" y="304" class="brand-title">ESPACIO</text>

  <!-- Gold Divider Line with Central Diamond -->
  <line x1="86" y1="326" x2="186" y2="326" stroke="#A98A54" stroke-width="1.8"/>
  <rect x="206.5" y="322.5" width="7" height="7" fill="#A98A54" transform="rotate(45 210 326)"/>
  <line x1="234" y1="326" x2="334" y2="326" stroke="#A98A54" stroke-width="1.8"/>

  <!-- Subtitle INTERIORS AND MODULAR -->
  <text x="210" y="350" class="brand-subtitle">INTERIORS AND MODULAR</text>
</svg>