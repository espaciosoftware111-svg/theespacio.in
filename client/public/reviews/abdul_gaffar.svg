<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="gaffarClip">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C3E50" />
      <stop offset="50%" stop-color="#4CA1AF" />
      <stop offset="100%" stop-color="#2C3E50" />
    </linearGradient>
    <linearGradient id="skinTone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C39E" />
      <stop offset="100%" stop-color="#D9A876" />
    </linearGradient>
  </defs>
  <g clip-path="url(#gaffarClip)">
    <!-- Background -->
    <rect width="100" height="100" fill="url(#bgGrad)" />
    <!-- Ambient highlight bokeh -->
    <circle cx="80" cy="30" r="25" fill="#5DADE2" opacity="0.25" />
    <circle cx="20" cy="70" r="20" fill="#48C9B0" opacity="0.2" />

    <!-- Shoulders & Dark Modern Jacket -->
    <path d="M 12 100 C 12 76, 26 70, 50 70 C 74 70, 88 76, 88 100 Z" fill="#1C2833" />
    <path d="M 38 72 L 50 88 L 62 72 Z" fill="#EAECEE" />
    <path d="M 44 80 L 50 96 L 56 80 Z" fill="#2C3E50" />

    <!-- Neck -->
    <rect x="43" y="52" width="14" height="20" fill="url(#skinTone)" rx="4" />

    <!-- Head / Face -->
    <ellipse cx="50" cy="46" rx="16" ry="19" fill="url(#skinTone)" />

    <!-- Modern Textured Hair -->
    <path d="M 32 44 C 30 30, 42 20, 52 20 C 64 20, 70 30, 68 44 C 65 30, 54 27, 44 31 C 36 34, 33 40, 32 44 Z" fill="#17202A" />
    <path d="M 33 40 C 36 28, 48 24, 60 25 C 67 26, 68 33, 67 38 C 62 31, 52 29, 44 33 C 38 36, 35 41, 33 40 Z" fill="#212F3D" />

    <!-- Ears -->
    <circle cx="33" cy="46" r="3.5" fill="#D9A876" />
    <circle cx="67" cy="46" r="3.5" fill="#D9A876" />

    <!-- Eyes & Brows -->
    <path d="M 40 40 Q 44 38 47 40" stroke="#17202A" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 53 40 Q 56 38 60 40" stroke="#17202A" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <circle cx="43.5" cy="45" r="1.8" fill="#17202A" />
    <circle cx="56.5" cy="45" r="1.8" fill="#17202A" />

    <!-- Nose & Smile -->
    <path d="M 50 44 L 49 51 L 52 51" stroke="#BD8C5B" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <path d="M 46 56 Q 50 59 54 56" stroke="#873600" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>
  <!-- Local Guide Star Badge in Bottom Corner -->
  <g transform="translate(68, 68)">
    <circle cx="12" cy="12" r="11" fill="#FFFFFF" stroke="#F39C12" stroke-width="1.5" />
    <circle cx="12" cy="12" r="9" fill="#E67E22" />
    <polygon points="12,5 14,9.5 19,10 15,13.5 16.5,18 12,15.5 7.5,18 9,13.5 5,10 10,9.5" fill="#FFFFFF" />
  </g>
</svg>
